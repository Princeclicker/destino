<!--====== End Header ======-->    <!-- header area end -->
       
       
    <!--====== Start Breadcrumb Section ======-->
        <section class="page-banner overlay pt-170 pb-170 bg_cover" style="background-image: url(IMG/theme/images/page-bg.jpg);">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-10">
                        <div class="page-banner-content text-center text-white">
                            <h1 class="page-title">Blog List</h1>
                            <ul class="breadcrumb-link text-white">
                                <li><a href="/">Home</a></li>
                                <li class="active">Blog List</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section><!--====== End Breadcrumb Section ======-->
        <!--====== Start Blog Section ======-->
        <section class="blog-list-section pt-100 pb-70">
            <div class="container">
                <div class="row">
                    <div class="col-xl-8">
                        <!--=== Blog List Wrapper ===-->
                        <div class="blog-list-wrapper">
                            <BOUCLE_posts(ARTICLES){id_rubrique=61}{par date}{inverse}>
                            <!--=== Single Blog Post ===-->
                            <div class="single-blog-post-four mb-30 wow fadeInDown" style="visibility: visible; animation-name: fadeInDown;">
                                <div class="post-thumbnail">
                                    <BOUCLE_bp(DOCUMENTS){id_article}{tout}{0,1}>
                                    <img src="#URL_DOCUMENT_FICHIER" alt="[(#TITRE|attribut_html)]">
                                    </BOUCLE_bp>
                                </div>
                                <div class="entry-content">
                                    <div class="post-meta">
                                        <span><i class="far fa-calendar-alt"></i><BOUCLE_pc(MOTS){id_article}><a href="#URL_MOT">#TITRE</a></BOUCLE_pc></span>
                                    </div>
                                    <h3 class="title"><a href="#URL_ARTICLE">#TITRE</a></h3>
                                    <h6 class="author"><i class="far fa-user"></i><a href="#URL_ARTICLE">Destino Access Hub</a></h6>
                                    <a href="#URL_ARTICLE" class="main-btn filled-btn">Read More<i class="fas fa-paper-plane"></i></a>
                                </div>
                            </div>
                            </BOUCLE_posts>
                        </div>
                        
                    </div>
                    <div class="col-xl-4">
                        <div class="sidebar-widget-area">
                            <!--=== Category Widget ===-->
                            <div class="sidebar-widget category-widget mb-30 wow fadeInUp" style="visibility: visible; animation-name: fadeInUp;">
                                <h4 class="widget-title">Category</h4>
                                <ul class="category-nav">
                                    <BOUCLE_cats(MOTS){type=article}{par titre}>
                                    <li><a href="#URL_MOT">#TITRE<i class="far fa-arrow-right"></i></a></li>
                                    </BOUCLE_cats>
                                </ul>
                            </div>
                            <!--=== Recent Post Widget ===-->
                            <div class="sidebar-widget recent-post-widget mb-40 wow fadeInUp" style="visibility: visible; animation-name: fadeInUp;">
                                <h4 class="widget-title">Recent News</h4>
                                <ul class="recent-post-list">
                                    <BOUCLE_recent(ARTICLES){id_rubrique=61}{par date}{inverse}{0,3}>
                                    <li class="post-thumbnail-content">
                                        <BOUCLE_r(DOCUMENTS){id_article}{tout}{0,1}>
                                        <img src="#URL_DOCUMENT_FICHIER" alt="[(#TITRE|attribut_html)]">
                                        </BOUCLE_r>
                                        <div class="post-title-date">
                                            <h5><a href="#URL_ARTICLE">#TITRE</a></h5>
                                            <span class="posted-on"><i class="far fa-calendar-alt"></i>#DATE|affdate{d F Y}</span>
                                        </div>
                                    </li>
                                    </BOUCLE_recent>
                                </ul>
                            </div>
                            <!--=== Banner Widget ===-->
                            <div class="sidebar-widget sidebar-banner-widget wow fadeInUp mb-40" style="visibility: visible; animation-name: fadeInUp;">
                                <div class="banner-widget-content">
                                    <div class="banner-img">
                                        <img src="IMG/theme/images/banner-1.jpg" alt="Post Banner">
                                        <div class="hover-overlay">
                                            <div class="hover-content">
                                                <h4 class="title"><a href="#">Lake Kivu</a></h4>
                                                <p><i class="fas fa-map-marker-alt"></i>Western Province, Rwanda</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!--=== Tag Widget ===-->
                            <div class="sidebar-widget tag-cloud-widget gray-bg mb-40 wow fadeInUp animated" style="visibility: visible; animation-name: fadeInUp;">
                                <h4 class="widget-title">Popular Tags</h4>
                                <BOUCLE_tag(MOTS){type=article}{par titre}>
                                <a href="#URL_MOT">#TITRE</a>
                                </BOUCLE_tag>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </section><!--====== End Blog Section ======-->

    <!-- footer area -->
    <!--====== Start Footer ======-->
