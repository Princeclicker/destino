[(#REM)
article.html — a single published article.
	Uses destn-2 template visual design for article pages.
)]
<BOUCLE_principale(ARTICLES) {id_article}>

<INCLURE{fond=_entete,niveau=article,rub=article,variante=home-three,titre=#TITRE,description=#CHAPO}>

<main id="contenu" class="main" role="main">

	<section class="page-head">
		<div class="wrap">
			<nav class="crumbs" aria-label="Breadcrumb">
				<ol>
					<li><a href="#URL_SITE_SPIP/">Home</a></li>
					<BOUCLE_ariane(HIERARCHIE) {id_article}>
						<li><a href="#URL_RUBRIQUE">#TITRE</a></li>
					</BOUCLE_ariane>
					<li aria-current="page">[(#TITRE|couper{40})]</li>
				</ol>
			</nav>
			<h1 class="page-title">#TITRE</h1>
			[<p class="page-lead">(#CHAPO|textebrut)</p>]
		</div>
	</section>

	<section class="wrap section-body">
		<div class="prose">
			#TEXTE
		</div>

		<B_nav>
		<nav class="siblings" aria-label="More in this section">
			<h2 class="body-h">More in <a href="#URL_RUBRIQUE">#TITRE</a></h2>
			<ul class="sibling-list">
				<BOUCLE_siblings(ARTICLES) {id_rubrique} {par titre}>
					<li><a href="#URL_ARTICLE">#TITRE</a></li>
				</BOUCLE_siblings>
			</ul>
		</nav>
		</B_nav>

		<p class="back-link"><a class="text-link" href="#URL_RUBRIQUE"><span class="arrow" aria-hidden="true">&larr;</span> Back to section</a></p>
	</section>

</main>

<INCLURE{fond=_pied}>

</BOUCLE_principale>
